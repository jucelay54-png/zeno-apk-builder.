name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'ZenoApp'
      web_url:
        description: 'Web URL'
        required: true
        default: 'https://example.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Process Inputs
        run: |
          echo "Building APK for App: ${{ github.event.inputs.app_name }}"
          echo "Target Website: ${{ github.event.inputs.web_url }}"

      - name: Build with Gradle
        run: echo "Gradle build simulation completed successfully!"
